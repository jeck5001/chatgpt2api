name: Flutter Image Studio

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/image_studio_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/image_studio_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: image-studio-android-debug-apk
          path: apps/image_studio_app/build/app/outputs/flutter-apk/app-debug.apk

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/image_studio_app
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --debug
      - uses: actions/upload-artifact@v4
        with:
          name: image-studio-linux-debug
          path: apps/image_studio_app/build/linux/x64/debug/bundle

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/image_studio_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --debug
      - uses: actions/upload-artifact@v4
        with:
          name: image-studio-windows-debug
          path: apps/image_studio_app/build/windows/x64/runner/Debug

  build-apple:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/image_studio_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --debug
      - run: flutter build ios --debug --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: image-studio-macos-debug
          path: apps/image_studio_app/build/macos/Build/Products/Debug
